name: Android native build

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup GraalVM
      uses: gluonhq/setup-graalvm@master
      env: 
        GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}

    - name: Setup JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Check env vars locations
      run: |
        echo "GRAALVM_HOME: $GRAALVM_HOME"
        echo "JAVA_HOME: $JAVA_HOME"
        java --version
        native-image --version

    - name: Install libraries
      run: |
        sudo apt-get update
        sudo apt install libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libgl-dev libgtk-3-dev libpango1.0-dev libxtst-dev
          
    - name: Make staging directory
      run: |
        mkdir stagingApk
        mkdir stagingLogs

    - name: Decode Keystore
      id: android_keystore_file
      uses: timheuer/base64-to-file@v1
      with:
        fileName: 'mykeystore.jks'
        encodedString: ${{ secrets.KEYSTORE }}

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name:  Build
      run: ./gradlew nativeBuild -Ptarget=android

    - name:  Package
      run: |
        export ANDROID_SDK=$ANDROID_HOME
        ./gradlew nativePackage -Ptarget=android -PcodeNumber=$GITHUB_RUN_NUMBER -PversionPatch=$GITHUB_RUN_NUMBER
      env:
        GLUON_ANDROID_KEYSTOREPATH: ${{ steps.android_keystore_file.outputs.filePath }}
        GLUON_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        GLUON_ANDROID_KEYALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        GLUON_ANDROID_KEYALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
          
    - name: Copy logs to staging
      if: always()
      run: |
        cp -r build/gluonfx/aarch64-android/gvm/log/*.log stagingLogs
        cp -r build/gluonfx/log/*.log stagingLogs
        cp -r build/gluonfx/aarch64-android/gensrc/android/*.xml stagingLogs

    - name: Copy natives to staging dir
	  if: always()
      run: |
        cp -r build/gluonfx/aarch64-android/gvm/*.apk stagingApk

    - name: Upload
      uses: actions/upload-artifact@v4
	  if: always()
      with:
        name: AndroidPackage
        path: stagingApk
    
    - name: Upload logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: AndroidLogs
        path: stagingLogs
