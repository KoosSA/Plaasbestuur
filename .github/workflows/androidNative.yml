name: Android native build

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup GraalVM
      uses: gluonhq/setup-graalvm@master
      env: 
        GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}

    - name: Install libraries
      run: |
        sudo apt-get update
        sudo apt install libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libgl-dev libgtk-3-dev libpango1.0-dev libxtst-dev
          
    - name: Make staging directory
      run: mkdir stagingApk

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # - name: Setup Gradle
    #   uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name:  Build
      run: ./gradlew nativeBuild -Ptarget=android --stacktrace

    - name:  Package
      run: ./gradlew nativePackage -Ptarget=android

    - name: Copy natives to staging dir
      run: |
        cp -r build/gluonfx/aarch64-android/gvm/*.apk stagingApk

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: AndroidPackage
        path: stagingApk
