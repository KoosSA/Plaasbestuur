plugins {
	id 'java'
	id 'org.openjfx.javafxplugin' version '0.1.0'
	id 'application'
	id 'com.gluonhq.gluonfx-gradle-plugin' version '1.0.24'
	id 'eclipse'
}

repositories {
	mavenCentral()
}

dependencies {
//	implementation 'com.google.api-client:google-api-client:2.7.0'
//	implementation 'com.google.apis:google-api-services-drive:v3-rev197-1.25.0'
//	implementation 'org.kohsuke:github-api:1.326'
//	implementation 'com.squareup.okhttp3:okhttp:4.12.0'
	

	
}

application {
	mainClassName = "koossa.plaasbestuur.Launcher"
}

javafx {
	version = "21.0.3"
	modules = [	"javafx.base", 
				"javafx.controls",
				"javafx.swing",
				"javafx.fxml",
				"javafx.graphics"]
}

gluonfx {
    target = 'host'
    if (project.hasProperty('target')) {
        target = project.getProperty('target')
    }
    appIdentifier = 'koossa.plaasbestuur'
    attachConfig {
        version = "4.0.21"
        configuration = "implementation";
        services "lifecycle", "storage", "display"
    }
    enableSwRendering = false
    release {
        // Android
        appLabel = "Plaasbestuur"
        versionCode = codeNumber
        versionName = versionNumber
        providedKeyStorePath = "${System.env.GLUON_ANDROID_KEYSTOREPATH}"
        providedKeyStorePassword = "${System.env.GLUON_ANDROID_KEYSTORE_PASSWORD}"
        providedKeyAlias = "${System.env.GLUON_ANDROID_KEYALIAS}"
        providedKeyAliasPassword = "${System.env.GLUON_ANDROID_KEYALIAS_PASSWORD}"
        // iOS
        // bundleName = ""
        // bundleVersion = ""
        // bundleShortVersion = ""
        // providedSigningIdentity = ""
        // providedProvisioningProfile = ""
        // skipSigning = false
    }
}


task('bumpVersion') {
	//toBump = 'Patch'
    doLast {
	    if (project.hasProperty('toBump')) {
	        toBump = project.getProperty('toBump')
	    } else {
	    	toBump = 'Patch'
	    }
        String type = toBump
        println "Bumping ${type.toLowerCase()} version…"
        int oldVCode = project.getProperty('codeNumber').toInteger()
        String oldVersionName = project.getProperty('versionNumber')
        version = new Version(oldVCode, oldVersionName)
        version."bump$type"()
        String newVersionName = version.getName()
        String newVersionCode = version.getCode()
        println "$oldVersionName ($oldVCode) -> $newVersionName ($newVersionCode)"
        def updated = file('gradle.properties').getText()
        updated = updated.replaceFirst("versionNumber=$oldVersionName", "versionNumber=$newVersionName")
        updated = updated.replaceFirst("codeNumber=$oldVCode", "codeNumber=$newVersionCode")
        
        file('gradle.properties').setText(updated)
    }
}







class Version {
    private int major
    private int minor
    private int patch
    private int code
    Version(int code, String version) {
        this.code = code
        def (major, minor, patch) = version.tokenize('.')
        this.major = major.toInteger()
        this.minor = minor.toInteger()
        this.patch = patch.toInteger()
    }
    @SuppressWarnings("unused")
    void bumpMajor() {
        major += 1
        minor = 0
        patch = 0

        code += 1
    }
    @SuppressWarnings("unused")
    void bumpMinor() {
        minor += 1
        patch = 0

        code += 1
    }
    @SuppressWarnings("unused")
    void bumpPatch() {
        patch += 1
        code += 1
    }
    String getName() { "$major.$minor.$patch" }
    int getCode() { code }
}